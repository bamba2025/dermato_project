[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "derma-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40", "alembic==1.15.2", "psycopg[binary]==3.2.7",
  "pydantic-settings==2.9.1", "email-validator==2.2.0",
  "PyJWT==2.10.1", "pwdlib[argon2]==0.2.1",
  "redis==5.2.1", "rq==2.3.2", "boto3==1.38.8",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0", "build==1.2.2.post1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
