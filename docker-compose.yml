name: derma-ai

x-app: &app
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://derma:${POSTGRES_PASSWORD:?Run scripts/init-env.ps1}@postgres:5432/derma
    REDIS_URL: redis://:${REDIS_PASSWORD:?Run scripts/init-env.ps1}@redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: derma
      POSTGRES_USER: derma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.ps1}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U derma -d derma"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-env.ps1}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: derma-minio:2025-04-22
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-init:
    image: derma-mc:2025-04-16
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      target: mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.ps1}
      S3_BUCKET: ${S3_BUCKET:-derma-private}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: [python, -m, worker.main]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, worker.healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  minio-data:
